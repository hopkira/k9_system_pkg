voice_piper:
  ros__parameters:
    model_path: /home/hopkira/k9_piper_voice/k9_model.onnx
    config_path: ""
    use_cuda: false

    warmup_enabled: true
    warmup_text: "Affirmative."

    # Established K9 priority/cancellation interface
    action_name: /voice/speak

    # Existing speech status/expression outputs
    is_talking_topic: /voice/is_talking
    rms_topic: /voice/rms_level
    state_topic: /voice/state

    pipewire_executable: pw-play
    pipewire_volume: 1.0
    rms_frame_ms: 50
