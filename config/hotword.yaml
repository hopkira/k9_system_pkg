hotword:
  ros__parameters:
    # This is the device that has already been proven with:
    # sherpa-onnx-keyword-spotter-alsa ... plughw:0,0
    #
    # Replace it with a stable named ALSA device from `arecord -L`
    # once you have confirmed the CM108's persistent card name.
    audio_device: "plughw:0,0"

    sample_rate: 16000
    channels: 1
    frame_ms: 20

    model_dir: "~/k9_models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"
    keywords_file: "~/k9_models/keywords.txt"

    encoder_file: "encoder-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
    decoder_file: "decoder-epoch-13-avg-2-chunk-8-left-64.onnx"
    joiner_file: "joiner-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
    tokens_file: "tokens.txt"

    provider: "cpu"
    num_threads: 2
    max_active_paths: 4
    num_trailing_blanks: 1

    # The per-keyword :score and #threshold values in keywords.txt take
    # precedence for those keywords; these remain sensible global defaults.
    keywords_score: 1.0
    keywords_threshold: 0.25

    audio_topic: "/audio/raw"
    hotword_topic: "/hotword_detected"
    effective_state_topic: "/audio/effective_state"

    # Lets the node be tested before the Audio State Manager is connected.
    initial_effective_state: "WAITING_FOR_HOTWORD"
